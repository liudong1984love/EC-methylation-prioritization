# Analysis parameters — EC methylation prioritization (manuscript v9.11)
# These are heuristic screening rules for candidate prioritisation, not
# cross-platform biological constants; final thresholds must be locked in the
# validation cohort under one predefined pipeline.

positivity:
  beta_cutoff: 0.3            # tumour positivity called at beta > 0.3

background_gate:
  rule: "P95 beta <= 0.15 in every assessable cohort (union rule)"
  quantile_type: 7            # R quantile type 7 (linear interpolation)
  note: "max, P90 and proportion above 0.15 reported alongside (small-n tails unstable)"

discovery:
  entry_effect_size: 0.30     # delta-beta >= 0.30 entry criterion
  dmr:
    merge_distance_bp: 500
    min_probes_per_region: 3
    probe_fdr: 0.05
    region_p: "Stouffer, candidate generation only (not calibrated confirmatory evidence)"
  cross_check:
    method: bumphunter
    permutations: 500
    maxGap_bp: 500
    scope: "chromosome-wide nulls on chr2 and chr6 (chromosome-wise, NOT genome-wide)"
    min_reportable_empirical_p: 0.002   # (k+1)/(B+1) = 1/501
    seed: 42

threshold_scan:
  gate_range: [0.05, 0.30]

bootstrap:
  draws: 10000
  seeds:
    python_np_default_rng: 42     # background bootstrap CIs (script 40)
    r_set_seed: 20260906          # GSE73949 noob bootstrap CIs (script 56)

confounder_models:                # v9.11 sensitivity analyses (limma, M-values)
  covariates: ["age", "histological type (adjacent normal / endometrioid / non-endometrioid)"]
  additional:
    - "endometrioid-only age-adjusted model"
    - "tumour-only molecular-subtype association model (PanCanAtlas subtypes)"

menopause_analysis:
  groups: "28 premenopausal vs 345 postmenopausal TCGA tumours"
  tests: ["Welch t on M-values", "Fisher exact on positivity", "exploratory tissue x menopause interaction"]
  caveat: "underpowered; equivalence not established"

multiple_testing: "Benjamini-Hochberg (FDR)"
positivity_ci: "Wilson score intervals"
